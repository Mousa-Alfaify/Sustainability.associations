name: نشر الموقع على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# النشر يتم بدفع الملفات الثابتة إلى فرع gh-pages،
# وهو مصدر GitHub Pages المفعّل على هذا المستودع.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: تثبيت الحزم
        run: npm ci

      - name: فحص الأنواع
        run: npm run typecheck

      - name: بناء الموقع كملفات ثابتة
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: دفع المخرجات إلى فرع gh-pages
        working-directory: out
        run: |
          git init -q
          git checkout -qb gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "نشر ${GITHUB_SHA::7} من main"
          git push -qf \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
